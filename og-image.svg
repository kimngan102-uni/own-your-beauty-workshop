<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8FB"/>
      <stop offset="100%" stop-color="#FDEEF3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <circle cx="80" cy="70" r="220" fill="#DB2777" opacity="0.18" filter="url(#softBlur)"/>
  <circle cx="1150" cy="580" r="240" fill="#111827" opacity="0.12" filter="url(#softBlur)"/>

  <!-- Badge icon: abstract flower/sparkle mark, not an emoji glyph, for reliable cross-platform rendering -->
  <g transform="translate(600,196)">
    <circle cx="0" cy="0" r="52" fill="url(#accent)"/>
    <g fill="#ffffff" opacity="0.95">
      <circle cx="0" cy="-22" r="11"/>
      <circle cx="19" cy="-7" r="11"/>
      <circle cx="12" cy="17" r="11"/>
      <circle cx="-12" cy="17" r="11"/>
      <circle cx="-19" cy="-7" r="11"/>
      <circle cx="0" cy="0" r="10" fill="#DB2777"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="332" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#111827" text-anchor="middle" letter-spacing="1">OWN YOUR BEAUTY</text>

  <!-- Underline accent (mimics the pink swoosh under the title on the workshop flyer) -->
  <path d="M 370 359 Q 600 382 830 359" stroke="#DB2777" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 385 370 Q 600 390 815 370" stroke="#DB2777" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="600" y="426" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" fill="#4B5563" text-anchor="middle">Workshop Makeup cùng Makeup Artist Yến Juhee</text>

  <!-- Tag row -->
  <text x="600" y="476" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#6B7280" text-anchor="middle">Chủ Nhật 16/8  ·  9h00 - 11h30  ·  AQUARIA, 29 Lê Đức Thọ</text>
</svg>
